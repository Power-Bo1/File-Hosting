# PostgreSQL credentials. Real values - gitignored (see .gitignore).
# Template for version control: k8s/postgres-secret.example.yaml
#
# Consumed by:
#   - postgres Deployment (envFrom)     k8s/postgres.yaml
#   - api Deployment (DB_NAME/USER/PW)  k8s/api.yaml
#   - backup CronJob (PGDATABASE/...)   k8s/postgres-backup.yaml
#   - backup-shell helper pod           k8s/backup-shell.yaml
#
# Changing POSTGRES_PASSWORD after the database is initialized does NOT
# change it inside Postgres - the password lives in the PGDATA volume.
# To rotate: ALTER USER appuser WITH PASSWORD '...' in psql, then update
# this Secret and restart the api Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fileapp
type: Opaque
stringData:
  POSTGRES_DB: clientfiles
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: "CHANGE_ME_strong_password"
