# Secrets for the auth layer.
# GENERATE REAL VALUES before applying:
#   openssl rand -hex 32   (run twice, once per key)
apiVersion: v1
kind: Secret
metadata:
  name: app-auth-secret
  namespace: fileapp
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_openssl_rand_hex_32"
  FLASK_SECRET_KEY: "CHANGE_ME_openssl_rand_hex_32"
