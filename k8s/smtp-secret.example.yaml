# OPTIONAL - credentials for a REAL email provider only.
# Do NOT apply this while using the in-cluster Mailpit (it needs no auth);
# the api Deployment references these keys with optional: true, so this
# Secret may simply not exist.
#
# Real-provider swap (e.g. Gmail app password):
#   1. In k8s/api.yaml set SMTP_HOST=smtp.gmail.com, SMTP_PORT="587",
#      SMTP_STARTTLS="true", SMTP_FROM=you@gmail.com
#   2. Fill the values below and: kubectl apply -f k8s/smtp-secret.yaml
#   3. kubectl rollout restart deploy/api -n fileapp
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: fileapp
type: Opaque
stringData:
  SMTP_USER: "CHANGE_ME_user@example.com"
  SMTP_PASS: "CHANGE_ME_app_password"
