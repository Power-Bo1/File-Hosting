# Lab PKI: bootstrap self-signed issuer -> 10-year CA cert -> CA issuer.
# Apply AFTER cert-manager itself is installed and its webhook is Ready.
# Ingresses then request certs with the annotation:
#   cert-manager.io/cluster-issuer: lab-ca-issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: file-host-lab-ca
  secretName: lab-ca-secret
  duration: 87600h           # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca-issuer
spec:
  ca:
    secretName: lab-ca-secret
