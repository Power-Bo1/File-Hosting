# Grafana admin credentials. Real values - gitignored (see .gitignore).
# Template for version control: k8s/grafana-secret.example.yaml
#
# Referenced by helm/grafana-values.yaml via admin.existingSecret, so the
# chart injects GF_SECURITY_ADMIN_USER / _PASSWORD from here instead of
# carrying them in the values file.
#
# Apply BEFORE `helm install grafana` (the namespace must exist first).
# Note: Grafana stores the admin password in its own database at first
# start. If you change it here later and the login doesn't update, reset
# it inside the pod:
#   kubectl exec -n logging deploy/grafana -- \
#     grafana cli admin reset-admin-password '<new-password>'
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: logging
type: Opaque
stringData:
  admin-user: admin
  admin-password: "CHANGE_ME_strong_password"
