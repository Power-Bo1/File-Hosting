# In-cluster image registry, exposed on the LAN via MetalLB.
# Pin the IP (192.168.1.210) to something in your MetalLB pool that is
# NOT the ingress IP. Configure containerd on EVERY node to trust it
# as insecure HTTP (see README, Part 2.2).
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - containerPort: 5000
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 300m, memory: 256Mi }
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: registry-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.210
spec:
  type: LoadBalancer
  selector: { app: registry }
  ports:
  - port: 5000
    targetPort: 5000
