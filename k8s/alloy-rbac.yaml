# Lets Grafana Alloy read pod logs through the Kubernetes API.
# Apply this AFTER installing the alloy Helm chart (SA is named "alloy").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-logs
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "namespaces", "nodes", "nodes/proxy"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-logs
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: logging
