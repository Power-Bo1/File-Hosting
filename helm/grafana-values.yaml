# Grafana exposed on the LAN via MetalLB, with Loki pre-wired.
# Credentials are NOT in this file - they come from the Secret
# k8s/grafana-secret.yaml, which must be applied to the `logging`
# namespace before `helm install grafana`.
admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password
service:
  type: LoadBalancer
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      isDefault: true
